spring:
  application:
    name: vouchers
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vouchers}
    username: ${DB_USERNAME:vouchers}
    password: ${DB_PASSWORD:vouchers}
    hikari:
      # Bounded pool acts as natural backpressure for virtual threads.
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    # Keep DB connections scoped to transactions, never to the whole HTTP request.
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; Hibernate only validates the mapping.
      ddl-auto: validate
  threads:
    virtual:
      enabled: true
  docker:
    compose:
      start:
        # "./mvnw spring-boot:run" starts only the database; the app service is for "docker compose up".
        arguments: postgres
  mvc:
    problemdetails:
      enabled: true

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
